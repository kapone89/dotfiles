[font]
size = 22.0

[font.bold]
family = "Ubuntu Mono"

[font.bold_italic]
family = "Ubuntu Mono"

[font.italic]
family = "Ubuntu Mono"

[font.normal]
family = "Ubuntu Mono"

[window]
decorations = "none"
startup_mode = "Maximized"

[[keyboard.bindings]]
key = "Backslash"
mods = "Alt"
chars = "\u001b\\"
